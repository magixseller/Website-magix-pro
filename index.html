
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAGIX TOOL SELLER - AI Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #020617;
      color: #f8fafc;
      margin: 0;
      overflow-x: hidden;
    }
    .magix-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); }
    .magix-text-gradient {
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    /* Advanced Animations */
    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.5; transform: scale(1); filter: blur(20px); }
      50% { opacity: 1; transform: scale(1.1); filter: blur(40px); }
    }
    @keyframes float-y {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    @keyframes morph-blob {
      0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
      50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
      100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    }

    .magic-loader {
      width: 60px; height: 60px; border-radius: 50%; border: 3px solid transparent;
      border-top-color: #6366f1; border-bottom-color: #ec4899; animation: orbit 1.5s linear infinite;
    }

    .aura-effect {
      position: fixed;
      top: 50%; left: 50%; width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(99, 102, 241, 0.03), transparent, rgba(168, 85, 247, 0.03), transparent);
      animation: orbit 30s linear infinite;
      z-index: -1; transform: translate(-50%, -50%);
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    
    @keyframes shimmer-glide {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }
    
    .soon-scanline {
      background: linear-gradient(to bottom, transparent, rgba(99, 102, 241, 0.2), transparent);
      height: 100%; width: 100%;
      animation: scan 3s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    .premium-blob {
      filter: blur(80px);
      animation: morph-blob 8s ease-in-out infinite, pulse-glow 5s ease-in-out infinite;
    }
  </style>
